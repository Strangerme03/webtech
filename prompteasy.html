<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            margin:10px;
            padding: 10px;
            border: 1px solid black;
            box-shadow: 1px 1px;

<body>
    <input type="button" onclick="alert('This is a alert popup.')" value="Open Alert Box"/><br>

</body>
</html>
