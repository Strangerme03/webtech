<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        /* Optional: Style for better visualization */
        ol {
            margin: 10px 0;
        }
        ul{
            list-style-type: square;
        }
    </style>
</head>
<body>
    <ol type="1">
        <li>Coffee
            <ol type="I" start="">
                <li>Black coffee</li>
                <li>Green coffee</li>
            </ol>
        </li>
        <li>Tea
            <ol type="A">
                <li>Black Tea</li>
                <li>Green Tea</li>
            </ol>
        </li>
    </ol>
    <ul>
        <li>home</li>
        <li>money</li>
    </ul>
</body>
</html>
