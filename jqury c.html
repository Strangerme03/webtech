<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Chaining Example</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            background-color: lightcoral;
            margin: 20px;
            text-align: center;
            color: white;
            font-size: 20px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="box">Slide Me</div>
    <button id="toggle-button">Toggle Slide</button>

    <script>
        $(document).ready(function() {
            $('#toggle-button').click(function() {
                $('.box').slideUp(1000)    // Slide up over 1 second
                    .delay(500)             // Wait for 0.5 seconds
                    .slideDown(1000);       // Slide down over 1 second
            });
        });
    </script>
</body>
</html>
